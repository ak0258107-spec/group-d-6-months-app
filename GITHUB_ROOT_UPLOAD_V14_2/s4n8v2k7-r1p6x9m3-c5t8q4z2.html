<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <title>Student Password Recovery | GK BY PURUSHOTAM SIR</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{min-height:100vh;background:radial-gradient(circle at 15% 15%,#173b70 0,#071426 45%,#020711 100%);display:grid;place-items:center;padding:20px}
    .recovery-shell{width:min(100%,520px);background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.7);border-radius:28px;padding:28px;box-shadow:0 28px 80px rgba(0,0,0,.42)}
    .recovery-brand{text-align:center;margin-bottom:18px}.recovery-brand .shield{font-size:46px}.recovery-brand h1{margin:8px 0 4px;font-size:27px}.recovery-brand p{margin:0;color:#586174}
    .recovery-shell label{display:block;font-weight:800;margin:14px 0 7px}.recovery-shell input{width:100%}.recovery-actions{display:grid;gap:10px;margin-top:18px}.recovery-help{font-size:13px;color:#667085;text-align:center;margin-top:14px;line-height:1.55}
  </style>
</head>
<body>
  <main class="recovery-shell">
    <div class="recovery-brand">
      <div class="shield">🔐</div>
      <h1>Student Password Recovery</h1>
      <p>GK BY PURUSHOTAM SIR</p>
    </div>
    <div id="studentRecoveryWaiting"><div class="notice notice-info">Reset link verify किया जा रहा है…</div></div>
    <section id="studentRecoveryForm" class="hidden">
      <label for="studentNewPassword">New Password</label>
      <input id="studentNewPassword" type="password" minlength="6" autocomplete="new-password" placeholder="कम से कम 6 अक्षर">
      <label for="studentNewPassword2">Confirm New Password</label>
      <input id="studentNewPassword2" type="password" minlength="6" autocomplete="new-password" placeholder="Password दोबारा लिखें">
      <div class="recovery-actions"><button id="studentRecoverySaveButton" class="btn btn-blue" type="button" onclick="saveStudentRecoveryPassword()">Update Password</button></div>
    </section>
    <div id="studentRecoveryMessage"></div>
    <div class="recovery-help">Password बदलने के बाद session बंद होगा और Login Page खुलेगा।</div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="student-recovery.js"></script>
</body>
</html>
